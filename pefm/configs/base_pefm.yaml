prefix: default
device: cuda
mode: train
log_dir: logs/${mode}
eval_data_path: null
use_wandb: true
seed: 0

agent:
  agent_name: pefm

env:
  env_class: ???
  num_eef: 2
  dof: 7
  eef_dim: 13
  vectorize: false
  args:
    num_eef: ${env.num_eef}
    dof: ${env.dof}
    seed: ${seed}
    obs_mode: "pc"
    ac_mode: "rel"
    max_episode_length: ???
    num_points: ${data.dataset.num_points}
    randomize_rotation: true
    randomize_scale: false
    scale_low: 1.0
    scale_high: 1.0
    scale_aspect_limit: 100.0
    uniform_scaling: false

data:
  dataset_class: base_dataset
  dataset:
    num_training_steps: ???
    path: null
    num_points: 1024
    num_augment: 0
    same_aug_per_sample: true
    aug_keep_original: true
    aug_scale_low: 0.5
    aug_scale_high: 1.5
    aug_scale_aspect_limit: 1.0
    aug_scale_rot: -1
    aug_scale_pos: 0.1
    aug_zero_z_offset: false
    aug_center: [0., 0., 0.]
    shuffle_pc: true
    num_workers: 12
    dof: ${env.dof}
    num_eef: ${env.num_eef}
    eef_dim: ${env.eef_dim}
    obs_horizon: ${model.obs_horizon}
    pred_horizon: ${model.pred_horizon}
    reduce_horizon_dim: false
    min_demo_length: 15

model:
  hidden_dim: 64
  obs_horizon: 2
  ac_horizon: 8
  pred_horizon: 16
  encoder:
    c_dim: ${model.hidden_dim}
    backbone_type: pointnet
    backbone_args:
      h_dim: ${model.hidden_dim}
      c_dim: ${model.encoder.c_dim}
      num_layers: 4
  obs_mode: ${env.args.obs_mode}
  ac_mode: ${env.args.ac_mode}
  use_torch_compile: false
  canonicalize: false    # scale/translation canonicalization (set true for new training)

  # PEFM symmetry selector
  symmetry:
    group_type: so2
    distribution_type: projected_normal
    num_samples: 8
    num_samples_eval: 16
    hidden_dim: 64
    entropy_weight: 0.01
    gumbel_tau: 1.0
    gumbel_tau_min: 0.1
    gumbel_anneal_rate: 0.0003

  # Flow matching (replaces noise_scheduler)
  ode_steps: 50
  ode_method: euler
  flow_sigma_min: 0.001

training:
  batch_size: 32
  num_epochs: 2000
  lr: 1e-4
  weight_decay: 1e-6
  num_eval_episodes: 10
  eval_interval: 200
  save_interval: 50
  vis_interval: 100
  ckpt: null

eval:
  last_ckpt: 1999
  num_ckpts_to_eval: 5

hydra:
  run:
    dir: ${log_dir}/${prefix}

wandb:
  entity: egedoganay
  project: pefm
