defaults:
  - base_pefm

env:
  env_class: nut_assembly_fixed
  num_eef: 1
  dof: 7
  eef_dim: 13
  args:
    num_eef: 1
    dof: 7
    max_episode_length: 400
    freq: 20
    randomize_rotation: false
    cam_resolution: 256
    num_points: ${data.dataset.num_points}
    camera_names: agentview
    has_renderer: false
    reward_shaping: false
    robots: Panda
    controller: OSC_POSE

data:
  dataset:
    path: /home/ege/pefm/data/nut_assembly_100_fixed/pcs
    num_points: 1024
    num_demos: 50
    num_workers: 32
    num_augment: 4
    aug_c4_rot: true
    aug_scale_rot: -1
    aug_keep_original: true
    aug_scale_low: 1.0
    aug_scale_high: 1.0
    aug_scale_pos: 0.02
    aug_zero_z_offset: true
    aug_center: [0.0, 0.0, 0.0]

training:
  batch_size: 64
  num_epochs: 200
  lr: 1e-4
  num_eval_episodes: 20
  eval_interval: 50
  save_interval: 50

model:
  hidden_dim: 256
  symmetry:
    group_type: c4
    distribution_type: gumbel_categorical
    num_samples: 4
    num_samples_eval: 8
    entropy_weight: 0.005
    gumbel_tau: 1.0
    gumbel_tau_min: 0.1
    gumbel_anneal_rate: 0.0003

wandb:
  entity: null
  project: pefm
