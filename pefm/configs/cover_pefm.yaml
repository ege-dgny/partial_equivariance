defaults:
  - base_pefm

env:
  env_class: cover
  args:
    max_episode_length: 50
    ac_noise: 0.0
    vis: false
    freq: 5
    cam_resolution: 256
    deform_bending_stiffness: 0.01
    deform_damping_stiffness: 1.0
    deform_elastic_stiffness: 300.0
    deform_friction_coeff: 10.0

model:
  symmetry:
    group_type: so2
    distribution_type: projected_normal
    num_samples: 8
    entropy_weight: 0.01
