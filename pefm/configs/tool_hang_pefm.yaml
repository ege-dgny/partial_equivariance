defaults:
  - base_pefm

env:
  env_class: tool_hang
  num_eef: 1
  dof: 7
  eef_dim: 13
  args:
    num_eef: 1
    dof: 7
    max_episode_length: 700
    freq: 20
    randomize_rotation: false
    cam_resolution: 256
    num_points: ${data.dataset.num_points}
    camera_names: agentview
    has_renderer: false
    reward_shaping: false
    robots: Panda
    controller: OSC_POSE

data:
  dataset:
    path: /home/ege/pefm/data/tool_hang/pcs
    num_points: 256
    num_demos: 200
    num_workers: 32
    # SO2 rotation augmentation: tool_hang demos have zero rotation variation;
    # augment with full 360 deg rotation so the selector learns equivariance
    num_augment: 8
    aug_scale_rot: -1        # full 360 deg uniform random rotation
    aug_keep_original: true  # always include the original trajectory
    aug_scale_pos: 0.02      # small position jitter (2cm std)
    aug_zero_z_offset: true  # no vertical jitter
    aug_center: [0.0, 0.0, 0.0]

training:
  batch_size: 256
  num_epochs: 3000
  lr: 1e-4
  num_eval_episodes: 8
  eval_interval: 300
  save_interval: 100

model:
  hidden_dim: 128
  symmetry:
    group_type: so2
    distribution_type: projected_normal
    num_samples: 8
    num_samples_eval: 16
    entropy_weight: 0.01

wandb:
  entity: null
  project: pefm
